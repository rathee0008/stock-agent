name: Keep Streamlit app awake

# Streamlit Community Cloud puts apps to sleep after ~12 hours without a visitor, and a plain HTTP
# request does not wake them: the app only starts when a real browser loads it and runs its JavaScript.
# This job opens the page in headless Chromium (and presses "Yes, get this app back up!" if shown).
# Set the repository variable STREAMLIT_APP_URL, e.g. https://rathee0008-stock-agent.streamlit.app

on:
  schedule:
    - cron: "17 */8 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && playwright install --with-deps chromium
      - name: Visit the app
        env:
          APP_URL: ${{ vars.STREAMLIT_APP_URL }}
        run: python scripts/keepalive.py
